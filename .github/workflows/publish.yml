name: Publish to npm

# 触发方式：
#   1. 推一个与 package.json 版本一致的 tag（如 v0.1.0）—— 正式发布
#   2. 在 Actions 页面手动触发 —— 可勾干跑，或临时填入 OTP
#
# 关于 NPM_TOKEN 的类型（踩过的坑）：
#   * 推荐 **Automation** 类型：npmjs.com → Access Tokens → Generate New Token
#     → Classic Token → Automation。这类 token 发布时不需要 OTP，可无人值守。
#   * 若用的是 Publish 类型（受 2FA 保护），CI 里会报 `EOTP`，
#     此时可手动触发本 workflow，在 otp 输入框填入 30 秒内的一次性验证码。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做干跑（npm publish --dry-run），不真正发布'
        type: boolean
        default: false
      otp:
        description: '一次性验证码。仅当 NPM_TOKEN 不是 Automation 类型时填写，30 秒内有效'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    name: 测试并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 规范化 package.json
        run: npm pkg fix

      - name: 运行单元测试
        run: npm test

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "tag=${tag_version}  package.json=${pkg_version}"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::tag 版本与 package.json 不一致，请先同步版本号再打 tag"
            exit 1
          fi

      - name: 校验 token 是否配置
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::仓库 secrets 里缺少 NPM_TOKEN，请在 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          echo "NPM_TOKEN 已配置（长度 ${#NODE_AUTH_TOKEN}）"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布到 npm
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::干跑模式，不会真正发布"
            npm publish --dry-run
            exit 0
          fi
          args=(--access public)
          if [ -n "${{ inputs.otp }}" ]; then
            echo "::notice::使用手动输入的 OTP"
            args+=("--otp=${{ inputs.otp }}")
          fi
          npm publish "${args[@]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 输出结果
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          {
            echo "### 已发布 ${name}@${version}"
            echo ""
            echo "- npm: https://www.npmjs.com/package/${name}"
            echo "- 版本校验: \`npm view ${name} version --registry https://registry.npmjs.org\`"
          } >> "$GITHUB_STEP_SUMMARY"
