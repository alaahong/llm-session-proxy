name: Token check

# 临时：探测 NPM_TOKEN 的类型与账号 2FA 模式，结果写进 ci-diagnostics 分支供本地读取。
# 查完即删。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tokencheck.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 探测 token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          {
            echo "# NPM_TOKEN 探测"
            echo
            echo "- 长度 = ${#NODE_AUTH_TOKEN}"
            echo "- 前缀 = ${NODE_AUTH_TOKEN:0:4}"
            echo
            echo "## 1. npm whoami"
            echo '```'
            npm whoami 2>&1
            echo '```'
            echo
            echo "## 2. GET /-/npm/v1/tokens（token 列表，看 readonly 字段）"
            echo '```'
            curl -sS -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
              "https://registry.npmjs.org/-/npm/v1/tokens" \
              -w "\n  http=%{http_code}\n" 2>&1
            echo '```'
            echo
            echo "## 3. GET /-/npm/v1/user（账号资料，看 tfa 字段）"
            echo '```'
            curl -sS -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
              "https://registry.npmjs.org/-/npm/v1/user" \
              -w "\n  http=%{http_code}\n" 2>&1
            echo '```'
          } > token.md 2>&1

          # 防止把凭据带上公开分支
          if grep -qF "$NODE_AUTH_TOKEN" token.md 2>/dev/null; then
            echo "::error::探测结果里出现了 token 原文，已删除产物、中止上传"
            rm -f token.md
            exit 1
          fi

          echo "--- 探测结果 ---"
          cat token.md

      - name: 把结果推到 ci-diagnostics 分支
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f token.md ]; then
            echo "没有结果文件，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-diagnostics
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 ! -name '.git' ! -name 'token.md' -exec rm -rf {} +
          git add -A
          git commit -m "ci: token 探测（run ${GITHUB_RUN_ID}）"
          git push --force origin ci-diagnostics
          echo "已推送 ci-diagnostics"
