name: Deploy docs to GitHub Pages

# 为什么用官方三件套（configure-pages / upload-pages-artifact / deploy-pages）：
#   1. configure-pages 开了 enablement，能在 Pages 还没启用时**自动开启**
#      （只推一个 gh-pages 分支是不会自动开启的，必须在设置里点一次）；
#   2. 产物由 Actions 直接部署，不需要再维护一个 gh-pages 分支，
#      也不会出现「分支内容更新了但站点没更新」这种错觉。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 打包文档站
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Pages（未启用则尝试自动开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传 docs/ 作为 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: 发布到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 输出结果
        run: |
          {
            echo "### 文档站已发布"
            echo ""
            echo "- 中文: ${{ steps.deployment.outputs.page_url }}"
            echo "- 英文: ${{ steps.deployment.outputs.page_url }}en/"
          } >> "$GITHUB_STEP_SUMMARY"
