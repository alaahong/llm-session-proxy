name: Sync docs to gh-pages

# docs/ 是站点源码，纳入版本管理；gh-pages 分支是发布产物，由本 workflow 自动同步。
# 推送本文件后，即可在 Settings → Pages 里选择 gh-pages 分支作为发布源
# （也可以直接用 main 的 /docs 目录，两种方式产出的站点地址相同）。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    name: 同步到 gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 把 docs/ 内容发布为 gh-pages 分支
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 用 docs/ 子树直接生成一个孤儿提交：不动工作区、不切换分支
          tree="$(git write-tree --prefix=docs/)"
          commit="$(git commit-tree "${tree}" -m "docs: 同步文档站（${GITHUB_SHA::7}）")"
          git push --force origin "${commit}:refs/heads/gh-pages"

          echo "已推送 gh-pages：${commit}"
          {
            echo "### gh-pages 已更新"
            echo ""
            echo "- commit: \`${commit}\`"
            echo "- 站点地址: https://alaahong.github.io/llm-session-proxy/"
          } >> "$GITHUB_STEP_SUMMARY"
